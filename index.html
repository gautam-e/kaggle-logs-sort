<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log Sorter</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2em; }
  textarea { width: 100%; height: 200px; font-family: monospace; }
  table { border-collapse: collapse; margin-top: 1em; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #eee; }
  td.msg { white-space: pre-wrap; font-family: monospace; }
  button { padding: 6px 14px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Log Sorter</h1>
<p>Paste log lines below. Each line should have <code>Time</code>, <code>#</code>, and <code>Log Message</code> columns (tab or multiple-space separated).</p>
<textarea id="input" placeholder="4.6s&#9;0&#9;0.00s - Debugger warning..."></textarea><br>
<button onclick="sortLogs()">Sort</button>
<div id="output"></div>

<script>
function parseTime(s) {
  // "4.6s" -> 4.6 ; also handles "1m2.3s", "1h2m3s"
  let total = 0, m;
  if ((m = s.match(/([\d.]+)h/))) total += parseFloat(m[1]) * 3600;
  if ((m = s.match(/([\d.]+)m(?!s)/))) total += parseFloat(m[1]) * 60;
  if ((m = s.match(/([\d.]+)ms/))) total += parseFloat(m[1]) / 1000;
  if ((m = s.match(/([\d.]+)s(?!\w)/))) total += parseFloat(m[1]);
  if (total === 0 && /^[\d.]+$/.test(s)) total = parseFloat(s);
  return total;
}

function sortLogs() {
  const raw = document.getElementById('input').value;
  const lines = raw.split('\n').filter(l => l.trim() !== '');
  const rows = [];
  for (const line of lines) {
    // Split on tabs or 2+ spaces
    const parts = line.split(/\t|\s{2,}/);
    if (parts.length < 3) continue;
    const time = parts[0].trim();
    const num = parts[1].trim();
    const msg = parts.slice(2).join(' ').trim();
    if (time.toLowerCase() === 'time') continue; // skip header
    rows.push({ time, timeVal: parseTime(time), num, numVal: parseInt(num, 10), msg });
  }
  rows.sort((a, b) => a.timeVal - b.timeVal || a.numVal - b.numVal);

  let html = '<table><thead><tr><th>Time</th><th>#</th><th>Log Message</th></tr></thead><tbody>';
  for (const r of rows) {
    html += `<tr><td>${r.time}</td><td>${r.num}</td><td class="msg">${escapeHtml(r.msg)}</td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('output').innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
